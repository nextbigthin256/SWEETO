<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWEETOS | Admin Portal</title>
  <meta name="description" content="Secure administration dashboard for SWEETOS workspace store catalog, orders, and configuration.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <link rel="stylesheet" href="./index.css?v=1.0.7">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    body {
      background: #0b0f19;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  
  <admin-page></admin-page>

  <!-- App Orchestrator Script -->
  <script type="module" src="./components/Admin/AdminPage.js?v=1.0.7"></script>

  <!-- Global Event Listener Engine for Cross-Tab & Cross-Device Re-rendering -->
  <script type="module">
    import { refreshStorageFromCloud } from './utils/storage.js';

    const triggerAdminRefresh = async () => {
      const adminEl = document.querySelector('admin-page');
      if (adminEl && typeof adminEl.loadDatabase === 'function') {
        await adminEl.loadDatabase(false);
        if (typeof adminEl.render === 'function') {
          adminEl.render(false);
        }
        if (typeof adminEl.attachListeners === 'function') {
          adminEl.attachListeners();
        }
      }
    };

    // Listen for data update events
    window.addEventListener('products:updated', async (e) => {
      console.log('🔄 [Admin Sync] products:updated event received.');
      const adminEl = document.querySelector('admin-page');
      if (adminEl && e.detail && Array.isArray(e.detail)) {
        adminEl.products = e.detail;
        if (typeof adminEl.render === 'function') adminEl.render(false);
        if (typeof adminEl.attachListeners === 'function') adminEl.attachListeners();
      } else {
        await triggerAdminRefresh();
      }
    });

    window.addEventListener('categories:updated', async (e) => {
      console.log('🔄 [Admin Sync] categories:updated event received.');
      const adminEl = document.querySelector('admin-page');
      if (adminEl && e.detail && Array.isArray(e.detail)) {
        adminEl.categories = e.detail;
        if (typeof adminEl.render === 'function') adminEl.render(false);
        if (typeof adminEl.attachListeners === 'function') adminEl.attachListeners();
      } else {
        await triggerAdminRefresh();
      }
    });

    window.addEventListener('brands:updated', async (e) => {
      console.log('🔄 [Admin Sync] brands:updated event received.');
      const adminEl = document.querySelector('admin-page');
      if (adminEl && e.detail && Array.isArray(e.detail)) {
        adminEl.brands = e.detail;
        if (typeof adminEl.render === 'function') adminEl.render(false);
        if (typeof adminEl.attachListeners === 'function') adminEl.attachListeners();
      } else {
        await triggerAdminRefresh();
      }
    });

    window.addEventListener('storage:synced', async () => {
      console.log('🔄 [Admin Sync] storage:synced event received.');
      await triggerAdminRefresh();
    });

    // Re-sync on window focus / visibility change
    window.addEventListener('focus', async () => {
      await refreshStorageFromCloud();
      await triggerAdminRefresh();
    });
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        await refreshStorageFromCloud();
        await triggerAdminRefresh();
      }
    });
  </script>
</body>
</html>
