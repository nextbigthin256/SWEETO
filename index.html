<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SWEETOS | Premium Tech & Workspace Accessories</title>
  <meta name="description" content="Discover SWEETOS, a high-end dashboard-style showcase of minimalist tech and desk gear with premium white and ice-blue aesthetics.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fraunces:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./index.css">

  <!-- Progressive Web App (PWA) Manifest & Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0052cc">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Apple iOS Safari PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SWEETOS">
  <link rel="apple-touch-icon" href="./assets/sweetos_logo.svg">

  <!-- Microsoft Windows Tile Meta Tags -->
  <meta name="msapplication-TileColor" content="#0052cc">
  <meta name="msapplication-TileImage" content="./assets/sweetos_logo.svg">

  <!-- Open Graph & WhatsApp Link Preview Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SWEETOS">
  <meta property="og:title" content="SWEETOS | Premium Tech & Workspace Accessories">
  <meta property="og:description" content="High-precision minimalist desk gear, tech accessories, and workspace essentials.">
  <meta property="og:image" content="https://www.sweeto.store/assets/sweetos_logo.svg">
  <meta property="og:image:secure_url" content="https://www.sweeto.store/assets/sweetos_logo.svg">
  <meta property="og:image:type" content="image/svg+xml">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SWEETOS | Premium Tech & Workspace Accessories">
  <meta name="twitter:description" content="High-precision minimalist desk gear and tech accessories curated for creators.">
  <meta name="twitter:image" content="https://www.sweeto.store/assets/sweetos_logo.svg">
</head>
<body>
  
  <!-- Top Navigation Panel -->
  <app-header id="main-header"></app-header>
  
  <!-- Floating Cart Toggle Pill (visible when Cart is closed) -->
  <button class="cart-toggle-float" id="cartFloatBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>
    <span class="float-badge" id="floatBadge">0</span>
    <span class="float-label">CART</span>
  </button>

  <!-- Overlay Backdrop for Mobile/Tablets cart draw -->
  <div class="cart-overlay" id="cartOverlay"></div>

  <!-- Primary Workspace Grid -->
  <div class="layout">
    <!-- Left Navigation Sidebar -->
    <app-sidebar id="main-sidebar"></app-sidebar>
    
    <!-- Central Main Viewport -->
    <main class="main-content" id="mainContent">
      <!-- Sliding Hero Banner Carousel -->
      <app-hero id="main-hero"></app-hero>
      
      <!-- Catalog list (Categories Circles, Promos, grids) -->
      <product-list id="main-product-list"></product-list>

      <!-- Storefront Footer with Contact Us & Information links -->
      <app-footer id="main-footer"></app-footer>
    </main>

    <!-- Right Sidebar Cart drawer -->
    <cart-drawer id="global-cart-drawer"></cart-drawer>

    <!-- Right Sidebar Notification drawer -->
    <notification-drawer id="global-notification-drawer" class="closed"></notification-drawer>
  </div>

  <!-- Global Modals -->
  <product-details-modal id="global-details-modal"></product-details-modal>
  <checkout-modal id="global-checkout-modal"></checkout-modal>

  <!-- Floating Toast Message popups -->
  <div class="toast" id="toast"></div>

  <!-- Mobile Bottom Navigation Bar -->
  <app-mobile-nav></app-mobile-nav>

  <!-- Global Floating WhatsApp Contact Button on Every Page -->
  <whatsapp-button id="global-whatsapp-btn"></whatsapp-button>

  <!-- Universal Multi-Device PWA Installer Banner -->
  <pwa-installer id="global-pwa-installer"></pwa-installer>

  <!-- Auto-Prompt & 1-Minute Recurring Web Push Notification Modal -->
  <push-prompt-modal id="global-push-prompt"></push-prompt-modal>

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Identity Services (Sign in with Google SDK) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- App Orchestrator Script -->
  <script type="module" src="./app.js"></script>
</body>
</html>
